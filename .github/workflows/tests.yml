name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # CPU-only PyTorch wheel: the default PyPI wheel pulls several GB of CUDA libraries.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[analysis,dev]"

      # Library versions, trained models, and a three-point smoke simulation.
      - name: Installation check
        run: python scripts/check_install.py

      - name: Test suite
        run: python -m pytest tests -q --durations=15
